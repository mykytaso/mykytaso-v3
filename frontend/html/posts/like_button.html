{% load static %}

<div id="like-button-container" class="like-button">
    <a
        class="like-button__link"
        hx-post="{% url 'toggle_like' post.slug %}"
        hx-target="#like-button-container"
        hx-swap="outerHTML"
    >
        {% if user_has_liked %}
            <img src="{% static 'images/icons/heart-filled.png' %}" alt="Like" class="icon">
        {% else %}
            <img src="{% static 'images/icons/heart-empty.png' %}" alt="Like" class="icon">
        {% endif %}
        <span>
            {{ like_count }}
        </span>
    </a>
</div>
