limit_req_zone $binary_remote_addr zone=mykytaso_limit:10m rate=3r/s;

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name mykytaso.com www.mykytaso.com;

;     ssl_certificate /home/mykyta/certs/mykytaso.com.cert.pem;
;     ssl_certificate_key /home/mykyta/certs/mykytaso.com.key.pem;

    rewrite ^(.*) https://mykytaso.com$1 permanent;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mykytaso.com;

    charset utf-8;
    client_max_body_size 15M;

    set_real_ip_from  172.17.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    rewrite ^/favicon.ico$ https://mykytaso.com/static/images/favicon.ico;
    rewrite ^/favicon.png$ https://mykytaso.com/static/images/favicon_32.png;

;     ssl_certificate /home/mykyta/certs/mykytaso.com.cert.pem;
;     ssl_certificate_key /home/mykyta/certs/mykytaso.com.key.pem;

    location /static/ {
        root /home/mykyta/mykytaso-v3/frontend/;
        gzip_static on;
        expires     max;
        add_header Cache-Control "public";
    }

    location / {
        limit_req zone=mykytaso_limit burst=50 nodelay;

        add_header "Access-Control-Allow-Origin" "*";
        add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS";
        add_header "Access-Control-Allow-Headers" "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        add_header "Access-Control-Expose-Headers" "Content-Length,Content-Range";
        add_header "Strict-Transport-Security" "max-age=31536000;includeSubDomains";
        add_header "X-Content-Type-Options" "nosniff";
        add_header "Referrer-Policy" "strict-origin-when-cross-origin";
        add_header "Permissions-Policy" "accelerometer=(),camera=(),geolocation=(),gyroscope=(),magnetometer=(),microphone=(),payment=(),usb=()";

        proxy_set_header "Host" $http_host;
        proxy_set_header "X-Forwarded-For" $proxy_add_x_forwarded_for;
        proxy_set_header "X-Forwarded-Proto" $scheme;
        proxy_redirect off;
        proxy_buffering off;

        proxy_pass http://0.0.0.0:8012;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

;     ssl_certificate /home/mykyta/certs/mykytaso.com.cert.pem;
;     ssl_certificate_key /home/mykyta/certs/mykytaso.com.key.pem;

    server_name _;

    return 404;
}
