server {
    listen 80;
    server_name mykytaso.com www.mykytaso.com;

    rewrite ^/favicon.ico$ https://mykytaso.com/static/images/favicon.ico;
    rewrite ^/favicon.png$ https://mykytaso.com/static/images/favicon-32x32.png;

    location /static/ {
        root /home/mykyta/mykytaso-v3/;
        gzip_static on;
        expires max;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
