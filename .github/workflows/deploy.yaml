name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - run: docker login ghcr.io -u $GITHUB_ACTOR -p ${{ secrets.TOKEN }}
      - run: docker build -t ghcr.io/$GITHUB_ACTOR/mykytaso-v3:latest -t ghcr.io/$GITHUB_ACTOR/mykytaso-v3:$GITHUB_SHA .
      - run: docker image push ghcr.io/$GITHUB_ACTOR/mykytaso-v3:$GITHUB_SHA
      - run: docker image push ghcr.io/$GITHUB_ACTOR/mykytaso-v3:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    env:
      SSH_KEY_PATH: /tmp/ssh_key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make envfile
        run: export | grep "secret_" | sed "s/declare -x secret_//" > .env
        env:
          secret_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          secret_APP_HOST: ${{ secrets.APP_HOST }}
          secret_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          secret_CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
          secret_DEBUG: ${{ secrets.DEBUG }}
          secret_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          secret_PGDATA: ${{ secrets.PGDATA }}
          secret_PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          secret_PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          secret_PRODUCTION_SSH_USERNAME: ${{ secrets.PRODUCTION_SSH_USERNAME }}
          secret_MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          secret_MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          secret_MAILGUN_API_URL: ${{ secrets.MAILGUN_API_URL }}
          secret_DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          secret_SERVER_EMAIL: ${{ secrets.SERVER_EMAIL }}
          secret_RECAPTCHA_PUBLIC_KEY: ${{ secrets.RECAPTCHA_PUBLIC_KEY }}
          secret_RECAPTCHA_PRIVATE_KEY: ${{ secrets.RECAPTCHA_PRIVATE_KEY }}
      - run: echo "GITHUB_SHA=$GITHUB_SHA" >> .env
      - run: echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ${{ env.SSH_KEY_PATH }} && chmod 600 ${{ env.SSH_KEY_PATH }}
      - run: scp -o StrictHostKeyChecking=no -i ${{ env.SSH_KEY_PATH }} .env ${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }}:/home/mykyta/mykytaso-v3/.env
      - run: scp -o StrictHostKeyChecking=no -i ${{ env.SSH_KEY_PATH }} docker-compose.production.yaml ${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }}:/home/mykyta/mykytaso-v3/docker-compose.production.yaml
      - run: ssh -i ${{ env.SSH_KEY_PATH }} ${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }} "cd /home/mykyta/mykytaso-v3 && echo ${{ secrets.TOKEN }} | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin && docker pull ghcr.io/$GITHUB_ACTOR/mykytaso-v3:$GITHUB_SHA && docker compose -f docker-compose.production.yaml --env-file=.env up -d && docker image rm \$(docker images ghcr.io/$GITHUB_ACTOR/mykytaso-v3 --filter before=ghcr.io/$GITHUB_ACTOR/mykytaso-v3:$GITHUB_SHA -q) 2>/dev/null || true"
